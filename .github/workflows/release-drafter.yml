name: Release Drafter

on:
  push:
    branches:
      - main
  # pull_request_target also labels pull requests from forks. The autolabeler
  # does not check out or run code from the pull request.
  pull_request_target:
    types: [ opened, reopened, synchronize, edited ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Drafts the next release notes as pull requests are merged into "main".
  update_release_draft:
    if: github.event_name != 'pull_request_target'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml

  # Labels pull requests based on the autolabeler section of release-drafter.yml.
  auto_label:
    if: github.event_name == 'pull_request_target'
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7
        with:
          config-name: release-drafter.yml
